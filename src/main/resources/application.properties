spring.application.name=finmate-backend
spring.datasource.url=jdbc:mysql://localhost:3307/finmate_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Colombo
# spring.datasource.url=jdbc:mysql://localhost:3307/finmate_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# make Hibernate map booleans to TINYINT for MySQL
spring.jpa.properties.hibernate.type.preferred_boolean_jdbc_type=TINYINT

# JWT Configuration
jwt.secret=mySecretKeyThatIsAtLeast32CharactersLongForHS256Algorithm
jwt.expiration=86400000

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true