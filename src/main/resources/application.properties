spring.application.name=finmate-backend
spring.datasource.url=jdbc:mysql://localhost:3307/finmate_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# make Hibernate map booleans to TINYINT for MySQL
spring.jpa.properties.hibernate.type.preferred_boolean_jdbc_type=TINYINT