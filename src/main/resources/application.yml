spring:
  application:
    name: finmate-backend
  datasource:
    url: jdbc:mysql://localhost:3307/finmate_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Colombo
    username: root
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        type:
          preferred_boolean_jdbc_type: TINYINT

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

# Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    enabled: true

# Exchange Rate API Configuration
exchangerate:
  api:
    key: ${EXCHANGE_RATE_API_KEY}